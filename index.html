<body>
<div id="root"></div>

<script type="text/babel">

const {
  useState,
  useEffect,
  useMemo,
  useRef
} = React;

const {
  ResponsiveContainer,
  BarChart,
  Bar,
  LineChart,
  Line,
  PieChart,
  Pie,
  Cell,
  CartesianGrid,
  XAxis,
  YAxis,
  Tooltip,
  ReferenceLine,
  Legend
} = Recharts;


/* =========================================================
   HELPERS
========================================================= */

const STORAGE_KEY = "earntrack_single_file_v1";

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function todayKey() {
  const d = new Date();
  return formatKey(d);
}

function formatKey(d) {
  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}

function money(n) {
  return "£" + Number(n || 0).toFixed(2);
}

function nativeMoney(n,currency) {
  n = Number(n || 0);

  if(currency === "GBP") return "£" + n.toFixed(2);
  if(currency === "USD") return "$" + n.toFixed(2);
  if(currency === "EUR") return "€" + n.toFixed(2);

  return Math.round(n).toLocaleString() + " pts";
}

function formatDateTime(date) {
  return new Date(date).toLocaleString(undefined,{
    dateStyle:"medium",
    timeStyle:"short"
  });
}

function formatDate(date) {
  return new Date(date + "T12:00:00").toLocaleDateString(undefined,{
    month:"short",
    day:"numeric",
    year:"numeric"
  });
}

function duration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;

  return [
    String(h).padStart(2,"0"),
    String(m).padStart(2,"0"),
    String(s).padStart(2,"0")
  ].join(":");
}

function download(filename,content,type) {
  const blob = new Blob([content],{type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = filename;
  a.click();

  URL.revokeObjectURL(url);
}

function safeLoad() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);

    if(!raw) return createDemoState(false);

    return JSON.parse(raw);
  } catch {
    return createDemoState(false);
  }
}


/* =========================================================
   DEFAULT DATA
========================================================= */

function createDemoState(includeEarnings=true) {

  const platforms = [
    {
      id:"prolific",
      name:"Prolific",
      color:"#8b5cf6",
      currency:"GBP",
      payout:6,
      pointsPerGbp:100,
      link:"https://www.prolific.com/",
      status:"active",
      balance:3.85
    },
    {
      id:"swagbucks",
      name:"Swagbucks",
      color:"#2563eb",
      currency:"POINTS",
      payout:500,
      pointsPerGbp:100,
      link:"https://www.swagbucks.com/",
      status:"active",
      balance:315
    },
    {
      id:"yougov",
      name:"YouGov",
      color:"#ef4444",
      currency:"POINTS",
      payout:5000,
      pointsPerGbp:5000,
      link:"https://account.yougov.com/",
      status:"idle",
      balance:1250
    },
    {
      id:"usertesting",
      name:"UserTesting",
      color:"#0ea5e9",
      currency:"USD",
      payout:10,
      pointsPerGbp:100,
      link:"https://www.usertesting.com/",
      status:"active",
      balance:7.5
    },
    {
      id:"qmee",
      name:"Qmee",
      color:"#f59e0b",
      currency:"GBP",
      payout:1,
      pointsPerGbp:100,
      link:"https://www.qmee.com/",
      status:"active",
      balance:2.4
    },
    {
      id:"prime",
      name:"Prime Opinion",
      color:"#10b981",
      currency:"POINTS",
      payout:500,
      pointsPerGbp:100,
      link:"https://www.primeopinion.com/",
      status:"active",
      balance:420
    }
  ];

  const settings = {
    daily:4,
    weekly:28,
    monthly:120,
    weekday:null,
    weekend:null,
    usd:0.79,
    eur:0.85,
    pointsPerGbp:100,
    redistribution:"rollover",
    theme:"dark",
    milestones:[50,100,250,500,1000]
  };

  let earnings = [];

  if(includeEarnings) {

    const now = new Date();

    for(let i=0;i<30;i++) {

      const d = new Date(now);
      d.setDate(d.getDate()-i);

      const key = formatKey(d);

      const base =
        i === 0 ? 2.85 :
        i === 1 ? 5.4 :
        i === 2 ? 3.1 :
        i === 3 ? 4.9 :
        i === 4 ? 2.2 :
        i === 5 ? 6.35 :
        i === 6 ? 4.25 :
        Math.random() * 5;

      const platform =
        platforms[i % platforms.length];

      let amount = base;

      if(platform.currency === "USD") {
        amount = base / settings.usd;
      }

      if(platform.currency === "POINTS") {
        amount = base * platform.pointsPerGbp;
      }

      earnings.push({
        id:uid(),
        platformId:platform.id,
        amount:Number(amount.toFixed(2)),
        note:[
          "Survey completed",
          "High paying study",
          "Screening bonus",
          "Micro task",
          "Product research"
        ][i%5],
        timestamp:
          key + "T" +
          String(9+(i%10)).padStart(2,"0") +
          ":" +
          String((i*13)%60).padStart(2,"0") +
          ":00"
      });
    }
  }

  return {
    platforms,
    earnings,
    withdrawals:[],
    settings,
    sessions:{}
  };
}


/* =========================================================
   CONVERSION
========================================================= */

function toGBP(amount,platform,settings) {

  if(platform.currency === "GBP")
    return amount;

  if(platform.currency === "USD")
    return amount * settings.usd;

  if(platform.currency === "EUR")
    return amount * settings.eur;

  return amount /
    (platform.pointsPerGbp ||
     settings.pointsPerGbp ||
     100);
}


/* =========================================================
   ICON COMPONENT
========================================================= */

function Icon({name,size=18}) {

  const ref = useRef(null);

  useEffect(()=>{
    if(ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const icon = window.lucide.icons[name];

      if(icon) {
        const svg = window.lucide.createElement(icon);
        svg.setAttribute("width",size);
        svg.setAttribute("height",size);
        ref.current.appendChild(svg);
      }
    }
  },[name,size]);

  return <span
    ref={ref}
    className="inline-flex shrink-0"
  />;
}


/* =========================================================
   MAIN APP
========================================================= */

function App() {

  const [data,setData] =
    useState(safeLoad);

  const [view,setView] =
    useState("dashboard");

  const [modal,setModal] =
    useState(null);

  const [toast,setToast] =
    useState("");

  const [selectedDate,setSelectedDate] =
    useState(todayKey());

  const [calendarMonth,setCalendarMonth] =
    useState(new Date());

  const [editingEarning,setEditingEarning] =
    useState(null);

  const [editingPlatform,setEditingPlatform] =
    useState(null);

  const [search,setSearch] =
    useState("");

  const [filterPlatform,setFilterPlatform] =
    useState("all");

  const [session,setSession] =
    useState({
      running:false,
      paused:false,
      elapsed:0
    });

  const fileRef = useRef(null);

  useEffect(()=>{
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

    document.documentElement.classList.toggle(
      "dark",
      data.settings.theme === "dark"
    );
  },[data]);

  useEffect(()=>{

    const timer = setInterval(()=>{

      setSession(current=>{

        if(!current.running || current.paused)
          return current;

        return {
          ...current,
          elapsed:current.elapsed+1
        };
      });

    },1000);

    return ()=>clearInterval(timer);

  },[]);

  useEffect(()=>{

    if(!toast) return;

    const t=setTimeout(
      ()=>setToast(""),
      2800
    );

    return ()=>clearTimeout(t);

  },[toast]);

  const notify = message =>
    setToast(message);

  const today = todayKey();

  function targetFor(date) {

    const day =
      new Date(date+"T12:00:00").getDay();

    if(day===0 || day===6)
      return data.settings.weekend ??
        data.settings.daily;

    return data.settings.weekday ??
      data.settings.daily;
  }

  function earningsForDate(date) {

    return data.earnings.reduce(
      (total,e)=>{

        if(e.timestamp.slice(0,10)!==date)
          return total;

        const p =
          data.platforms.find(
            x=>x.id===e.platformId
          );

        return total +
          (p
            ? toGBP(
                e.amount,
                p,
                data.settings
              )
            : 0);

      },
      0
    );
  }

  const todayEarned =
    earningsForDate(today);

  const todayTarget =
    targetFor(today);

  const remaining =
    Math.max(
      0,
      todayTarget-todayEarned
    );

  const percentage =
    todayTarget
      ? (todayEarned/todayTarget)*100
      : 0;

  const lifetime =
    data.earnings.reduce(
      (total,e)=>{

        const p =
          data.platforms.find(
            x=>x.id===e.platformId
          );

        return total +
          (p
            ? toGBP(
                e.amount,
                p,
                data.settings
              )
            : 0);

      },
      0
    );

  const monthKey =
    today.slice(0,7);

  const monthEarned =
    data.earnings.reduce(
      (total,e)=>{

        if(e.timestamp.slice(0,7)!==monthKey)
          return total;

        const p =
          data.platforms.find(
            x=>x.id===e.platformId
          );

        return total +
          (p
            ? toGBP(
                e.amount,
                p,
                data.settings
              )
            : 0);

      },
      0
    );

  const weekEarned = useMemo(()=>{

    let total=0;

    for(let i=0;i<7;i++) {

      const d=new Date();
      d.setDate(
        d.getDate()-i
      );

      total += earningsForDate(
        formatKey(d)
      );
    }

    return total;

  },[data]);

  const streak = useMemo(()=>{

    let count=0;
    const d=new Date();

    for(let i=0;i<366;i++) {

      const key=formatKey(d);

      if(
        earningsForDate(key)
        >= targetFor(key)
      ) {
        count++;
        d.setDate(
          d.getDate()-1
        );
      } else {
        break;
      }
    }

    return count;

  },[data]);

  const smartAction = useMemo(()=>{

    const candidates =
      data.platforms
      .filter(p=>p.status==="active")
      .map(p=>{

        const gap =
          Math.max(
            0,
            p.payout-p.balance
          );

        const gbpGap =
          toGBP(
            gap,
            p,
            data.settings
          );

        const progress =
          p.payout
            ? Math.min(
                100,
                p.balance /
                p.payout *
                100
              )
            : 0;

        return {
          platform:p,
          gap,
          gbpGap,
          progress
        };
      })
      .sort(
        (a,b)=>a.gbpGap-b.gbpGap
      );

    return candidates[0] || null;

  },[data]);

  function navigate(v) {
    setView(v);
    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }

  function celebrate() {

    if(window.confetti) {

      window.confetti({
        particleCount:180,
        spread:90,
        startVelocity:35,
        origin:{y:.65}
      });

    }
  }

  function finishDay() {

    if(todayEarned >= todayTarget) {

      celebrate();

      notify(
        "Target reached! Amazing work today 🎉"
      );

    } else {

      notify(
        money(remaining) +
        " remaining to hit today's goal."
      );
    }
  }

  function saveEarning(form) {

    const amount =
      Number(form.amount);

    if(!amount || amount<=0) {
      notify("Enter a valid amount.");
      return;
    }

    if(!form.platformId) {
      notify("Select a platform.");
      return;
    }

    if(form.id) {

      setData(d=>({
        ...d,
        earnings:d.earnings.map(e=>
          e.id===form.id
            ? {
                ...e,
                amount,
                platformId:form.platformId,
                note:form.note,
                timestamp:form.timestamp
              }
            : e
        )
      }));

      notify("Earning updated.");

    } else {

      setData(d=>({

        ...d,

        earnings:[
          {
            id:uid(),
            amount,
            platformId:form.platformId,
            note:form.note,
            timestamp:form.timestamp
          },
          ...d.earnings
        ],

        platforms:d.platforms.map(p=>
          p.id===form.platformId
            ? {
                ...p,
                balance:p.balance+amount
              }
            : p
        )

      }));

      notify("Earning logged.");

    }

    setModal(null);
  }

  function deleteEarning(id) {

    if(!confirmDelete(
      "Delete this transaction?"
    )) return;

    const item =
      data.earnings.find(
        e=>e.id===id
      );

    if(!item) return;

    setData(d=>({

      ...d,

      earnings:
        d.earnings.filter(
          e=>e.id!==id
        ),

      platforms:d.platforms.map(p=>
        p.id===item.platformId
          ? {
              ...p,
              balance:Math.max(
                0,
                p.balance-item.amount
              )
            }
          : p
      )

    }));

    notify("Transaction deleted.");
  }

  function confirmDelete(message) {
    return window.confirm(message);
  }

  function savePlatform(form) {

    if(!form.name.trim()) {
      notify("Enter a platform name.");
      return;
    }

    if(form.id) {

      setData(d=>({
        ...d,
        platforms:d.platforms.map(p=>
          p.id===form.id
            ? {
                ...p,
                ...form,
                payout:Number(form.payout),
                balance:Number(form.balance)
              }
            : p
        )
      }));

      notify("Platform updated.");

    } else {

      setData(d=>({
        ...d,
        platforms:[
          ...d.platforms,
          {
            ...form,
            id:uid(),
            payout:Number(form.payout),
            balance:Number(form.balance)
          }
        ]
      }));

      notify("Platform added.");
    }

    setModal(null);
  }

  function deletePlatform(id) {

    if(!confirmDelete(
      "Delete this platform? Its transactions will remain but become unassigned."
    )) return;

    setData(d=>({
      ...d,
      platforms:
        d.platforms.filter(
          p=>p.id!==id
        )
    }));

    notify("Platform deleted.");
  }

  function exportJSON() {

    download(
      `earntrack-backup-${today}.json`,
      JSON.stringify(data,null,2),
      "application/json"
    );

    notify("JSON backup exported.");
  }

  function exportCSV() {

    const rows=[
      [
        "Date",
        "Time",
        "Platform",
        "Native Amount",
        "Currency",
        "GBP Value",
        "Note"
      ]
    ];

    data.earnings.forEach(e=>{

      const p =
        data.platforms.find(
          x=>x.id===e.platformId
        );

      if(!p) return;

      rows.push([
        e.timestamp.slice(0,10),
        new Date(e.timestamp).toLocaleTimeString(),
        p.name,
        e.amount,
        p.currency,
        toGBP(
          e.amount,
          p,
          data.settings
        ).toFixed(2),
        e.note
      ]);

    });

    const csv =
      rows.map(
        row=>row.map(
          value=>{
            const s=String(value??"");
            return `"${s.replaceAll('"','""')}"`;
          }
        ).join(",")
      ).join("\n");

    download(
      `earntrack-earnings-${today}.csv`,
      csv,
      "text/csv"
    );

    notify("CSV exported.");
  }

  function loadDemo() {

    if(!confirmDelete(
      "Load realistic demo data? Your current data will be replaced."
    )) return;

    setData(
      createDemoState(true)
    );

    notify("Demo data loaded.");
  }

  function clearToday() {

    if(!confirmDelete(
      "Clear all earnings logged today?"
    )) return;

    setData(d=>({
      ...d,
      earnings:d.earnings.filter(
        e=>e.timestamp.slice(0,10)!==today
      )
    }));

    notify("Today's earnings cleared.");
  }

  function resetAll() {

    if(!confirmDelete(
      "RESET ALL DATA? This will permanently erase your local EarnTrack data."
    )) return;

    setData(
      createDemoState(false)
    );

    notify("All data reset.");
  }

  function importJSON(event) {

    const file =
      event.target.files?.[0];

    if(!file) return;

    const reader =
      new FileReader();

    reader.onload=()=>{
      try {

        const imported =
          JSON.parse(
            reader.result
          );

        if(
          !imported.platforms ||
          !imported.earnings ||
          !imported.settings
        ) {
          throw new Error();
        }

        if(!confirmDelete(
          "Restore this backup? Your current data will be replaced."
        )) return;

        setData(imported);

        notify(
          "Backup restored successfully."
        );

      } catch {

        notify(
          "Invalid EarnTrack backup file."
        );
      }
    };

    reader.readAsText(file);
  }

  function startSession() {

    setSession(s=>({
      ...s,
      running:true,
      paused:false
    }));

    notify("Work session started.");
  }

  function pauseSession() {

    setSession(s=>({
      ...s,
      paused:true
    }));

    notify("Session paused.");
  }

  function resumeSession() {

    setSession(s=>({
      ...s,
      running:true,
      paused:false
    }));

    notify("Session resumed.");
  }

  function stopSession() {

    if(session.elapsed<=0) {
      setSession({
        running:false,
        paused:false,
        elapsed:0
      });

      return;
    }

    setData(d=>({
      ...d,
      sessions:{
        ...d.sessions,
        [today]:
          (d.sessions[today]||0)
          +session.elapsed
      }
    }));

    setSession({
      running:false,
      paused:false,
      elapsed:0
    });

    notify(
      "Work session saved."
    );
  }

  function toggleTheme() {

    setData(d=>({
      ...d,
      settings:{
        ...d.settings,
        theme:
          d.settings.theme==="dark"
            ? "light"
            : "dark"
      }
    }));
  }

  return (
    <div className={
      data.settings.theme==="dark"
        ? "min-h-screen bg-slate-950 text-white"
        : "min-h-screen bg-slate-100 text-slate-950"

/* =========================================================
   EARNINGS HUB
========================================================= */

function EarningsHub({
  data,
  search,
  setSearch,
  filterPlatform,
  setFilterPlatform,
  selectedDate,
  setSelectedDate,
  editEarning,
  deleteEarning,
  addEarning
}) {

  const filtered =
    data.earnings
      .filter(e=>{

        const p =
          data.platforms.find(
            x=>x.id===e.platformId
          );

        const matchesSearch =
          !search ||
          p?.name
            .toLowerCase()
            .includes(
              search.toLowerCase()
            ) ||
          e.note
            .toLowerCase()
            .includes(
              search.toLowerCase()
            );

        const matchesPlatform =
          filterPlatform==="all" ||
          e.platformId===filterPlatform;

        const matchesDate =
          !selectedDate ||
          e.timestamp.slice(0,10)===selectedDate;

        return (
          matchesSearch &&
          matchesPlatform &&
          matchesDate
        );

      })
      .sort(
        (a,b)=>
          new Date(b.timestamp)-
          new Date(a.timestamp)
      );

  const filteredTotal =
    filtered.reduce(
      (total,e)=>{

        const p =
          data.platforms.find(
            x=>x.id===e.platformId
          );

        return total +
          (p
            ? toGBP(
                e.amount,
                p,
                data.settings
              )
            : 0);

      },
      0
    );

  function changeDay(amount) {

    const d =
      new Date(
        selectedDate+"T12:00:00"
      );

    d.setDate(
      d.getDate()+amount
    );

    setSelectedDate(
      formatKey(d)
    );
  }

  return (
    <div className="animate-slide-up space-y-5">

      <PageHeading
        eyebrow="Earnings Hub"
        title="Your complete earning ledger"
        text="Filter, review, edit, and manage every survey transaction."
        action={
          <button
            onClick={addEarning}
            className="btn btn-primary"
          >
            <Icon name="plus" size={17}/>
            Log Earning
          </button>
        }
      />


      <div className="grid gap-3 lg:grid-cols-[1fr_220px_180px]">

        <div className="relative">

          <div className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">
            <Icon name="search" size={17}/>
          </div>

          <input
            className="input pl-10"
            placeholder="Search platform or note..."
            value={search}
            onChange={e=>
              setSearch(e.target.value)
            }
          />

        </div>

        <select
          className="input"
          value={filterPlatform}
          onChange={e=>
            setFilterPlatform(e.target.value)
          }
        >
          <option value="all">
            All platforms
          </option>

          {data.platforms.map(p=>(
            <option
              key={p.id}
              value={p.id}
            >
              {p.name}
            </option>
          ))}

        </select>

        <input
          className="input"
          type="date"
          value={selectedDate}
          onChange={e=>
            setSelectedDate(e.target.value)
          }
        />

      </div>


      <div className="card p-4">

        <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">

          <div className="flex items-center gap-2">

            <button
              onClick={()=>changeDay(-1)}
              className="btn btn-secondary !min-h-10 !px-3"
            >
              <Icon name="arrow-left" size={16}/>
            </button>

            <div className="min-w-[170px] text-center">

              <div className="text-xs font-bold uppercase tracking-wider text-slate-500">
                Selected day
              </div>

              <div className="mt-0.5 font-black">
                {formatDate(selectedDate)}
              </div>

            </div>

            <button
              onClick={()=>changeDay(1)}
              className="btn btn-secondary !min-h-10 !px-3"
            >
              <Icon name="arrow-right" size={16}/>
            </button>

          </div>

          <button
            onClick={()=>setSelectedDate(todayKey())}
            className="btn btn-ghost"
          >
            Today
          </button>

          <div className="rounded-xl bg-emerald-500/10 px-4 py-2 text-center">

            <div className="text-[10px] font-bold uppercase tracking-wider text-emerald-400">
              Filtered total
            </div>

            <div className="font-black text-emerald-300">
              {money(filteredTotal)}
            </div>

          </div>

        </div>

      </div>


      <div className="card overflow-hidden">

        {filtered.length===0 ? (

          <EmptyState
            icon="search"
            title="No matching transactions"
            text="Try changing your date, platform, or search."
            action={addEarning}
          />

        ) : (

          <div className="divide-y divide-slate-800">

            {filtered.map(e=>{

              const p =
                data.platforms.find(
                  x=>x.id===e.platformId
                );

              if(!p) return null;

              return (
                <TransactionRow
                  key={e.id}
                  earning={e}
                  platform={p}
                  gbp={toGBP(
                    e.amount,
                    p,
                    data.settings
                  )}
                  edit={editEarning}
                  remove={deleteEarning}
                />
              );

            })}

          </div>

        )}

      </div>

    </div>
  );
}


/* =========================================================
   HISTORY
========================================================= */

function HistoryView({
  data,
  month,
  setMonth,
  openDay,
  targetFor,
  earningsForDate,
  streak
}) {

  const year=month.getFullYear();
  const monthIndex=month.getMonth();

  const firstDay =
    new Date(
      year,
      monthIndex,
      1
    ).getDay();

  const days =
    new Date(
      year,
      monthIndex+1,
      0
    ).getDate();

  const cells=[];

  for(let i=0;i<firstDay;i++)
    cells.push(null);

  for(let d=1;d<=days;d++)
    cells.push(d);

  while(cells.length%7)
    cells.push(null);

  let completed=0;
  let partial=0;

  cells.forEach(day=>{

    if(!day) return;

    const key =
      formatKey(
        new Date(
          year,
          monthIndex,
          day
        )
      );

    const earned =
      earningsForDate(key);

    const target =
      targetFor(key);

    if(earned>=target)
      completed++;

    else if(earned>0)
      partial++;

  });

  const completion =
    days
      ? completed/days*100
      : 0;

  return (
    <div className="animate-slide-up space-y-5">

      <PageHeading
        eyebrow="History & Calendar"
        title="See your earning consistency"
        text="Track target completion, streaks, and daily performance."
      />


      <div className="grid gap-3 sm:grid-cols-3">

        <StatCard
          title="Current streak"
          value={`${streak} days`}
          target="Consecutive targets"
          icon="flame"
          progress={100}
        />

        <StatCard
          title="Target days"
          value={`${completed}`}
          target={`${days} calendar days`}
          icon="check"
          progress={completion}
        />

        <StatCard
          title="Completion rate"
          value={`${Math.round(completion)}%`}
          target="Monthly"
          icon="target"
          progress={completion}
        />

      </div>


      <div className="card overflow-hidden">

        <div className="flex items-center justify-between border-b border-slate-800 p-5">

          <button
            onClick={()=>{
              setMonth(
                new Date(
                  year,
                  monthIndex-1,
                  1
                )
              );
            }}
            className="btn btn-secondary !min-h-10 !px-3"
          >
            <Icon name="arrow-left" size={16}/>
          </button>

          <div className="text-center">

            <div className="text-lg font-black">
              {month.toLocaleDateString(undefined,{
                month:"long",
                year:"numeric"
              })}
            </div>

            <div className="mt-1 flex justify-center gap-3 text-[10px] font-bold">

              <span className="text-emerald-400">
                {completed} target
              </span>

              <span className="text-amber-400">
                {partial} partial
              </span>

            </div>

          </div>

          <button
            onClick={()=>{
              setMonth(
                new Date(
                  year,
                  monthIndex+1,
                  1
                )
              );
            }}
            className="btn btn-secondary !min-h-10 !px-3"
          >
            <Icon name="arrow-right" size={16}/>
          </button>

        </div>


        <div className="grid grid-cols-7 border-b border-slate-800">

          {[
            "Sun",
            "Mon",
            "Tue",
            "Wed",
            "Thu",
            "Fri",
            "Sat"
          ].map(x=>(
            <div
              key={x}
              className="p-2 text-center text-[10px] font-black uppercase tracking-wider text-slate-600 sm:p-3"
            >
              {x}
            </div>
          ))}

        </div>


        <div className="grid grid-cols-7">

          {cells.map((day,index)=>{

            if(!day)
              return (
                <div
                  key={"empty"+index}
                  className="min-h-[85px] border-b border-r border-slate-800/60 bg-slate-950/20 sm:min-h-[110px]"
                />
              );

            const key =
              formatKey(
                new Date(
                  year,
                  monthIndex,
                  day
                )
              );

            const earned =
              earningsForDate(key);

            const target =
              targetFor(key);

            const status =
              earned>=target
                ? "complete"
                : earned>0
                  ? "partial"
                  : "empty";

            return (
              <button
                key={key}
                onClick={()=>openDay(key)}
                className={
                  "min-h-[85px] border-b border-r border-slate-800 p-2 text-left transition hover:bg-slate-900 sm:min-h-[110px] sm:p-3 " +
                  (key===todayKey()
                    ? "bg-emerald-500/[.04]"
                    : "")
                }
              >

                <div className="flex items-center justify-between">

                  <span className={
                    "text-xs font-black " +
                    (key===todayKey()
                      ? "text-emerald-400"
                      : "text-slate-400")
                  }>
                    {day}
                  </span>

                  {status==="complete" && (
                    <span className="flex h-5 w-5 items-center justify-center rounded-full bg-emerald-500/15 text-emerald-400">
                      <Icon name="check" size={11}/>
                    </span>
                  )}

                </div>

                <div className={
                  "mt-5 rounded-lg px-2 py-1 text-[10px] font-black " +
                  (
                    status==="complete"
                      ? "bg-emerald-500/10 text-emerald-400"
                      : status==="partial"
                        ? "bg-amber-500/10 text-amber-400"
                        : "bg-slate-800 text-slate-600"
                  )
                }>
                  {earned>0
                    ? money(earned)
                    : "—"}
                </div>

              </button>
            );
          })}

        </div>

        <div className="flex flex-wrap gap-4 border-t border-slate-800 p-4 text-[11px] font-bold text-slate-500">

          <span className="flex items-center gap-2">
            <i className="h-2.5 w-2.5 rounded-full bg-emerald-400"/>
            Target reached
          </span>

          <span className="flex items-center gap-2">
            <i className="h-2.5 w-2.5 rounded-full bg-amber-400"/>
            Partial
          </span>

          <span className="flex items-center gap-2">
            <i className="h-2.5 w-2.5 rounded-full bg-slate-600"/>
            Zero / rest
          </span>

        </div>

      </div>

    </div>
  );
}


/* =========================================================
   ANALYTICS
========================================================= */

function Analytics({
  data,
  targetFor,
  earningsForDate
}) {

  const [range,setRange] =
    useState(14);

  const daily=useMemo(()=>{

    const result=[];

    for(let i=range-1;i>=0;i--) {

      const d=new Date();
      d.setDate(
        d.getDate()-i
      );

      const key=formatKey(d);

      result.push({
        date:key,
        day:d.toLocaleDateString(undefined,{
          month:"short",
          day:"numeric"
        }),
        earnings:Number(
          earningsForDate(key).toFixed(2)
        ),
        target:Number(
          targetFor(key).toFixed(2)
        )
      });

    }

    return result;

  },[data,range]);


  const platformData=useMemo(()=>{

    return data.platforms.map(p=>({

      name:p.name,

      value:Number(
        data.earnings.reduce(
          (total,e)=>{

            if(e.platformId!==p.id)
              return total;

            return total+
              toGBP(
                e.amount,
                p,
                data.settings
              );

          },
          0
        ).toFixed(2)
      ),

      color:p.color

    })).filter(
      x=>x.value>0
    );

  },[data]);


  const weekdays=useMemo(()=>{

    const names=[
      "Sunday",
      "Monday",
      "Tuesday",
      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday"
    ];

    return names.map((name,index)=>{

      let total=0;
      let count=0;

      data.earnings.forEach(e=>{

        const d=
          new Date(e.timestamp);

        if(d.getDay()!==index)
          return;

        const p=
          data.platforms.find(
            x=>x.id===e.platformId
          );

        if(!p) return;

        total +=
          toGBP(
            e.amount,
            p,
            data.settings
          );

        count++;

      });

      return {
        day:name.slice(0,3),
        earnings:Number(
          total.toFixed(2)
        ),
        average:Number(
          (count
            ? total/count
            : 0
          ).toFixed(2)
        )
      };

    });

  },[data]);


  let cumulative=0;

  const trajectory =
    daily.map(x=>{
      cumulative+=x.earnings;

      return {
        day:x.day,
        total:Number(
          cumulative.toFixed(2)
        )
      };
    });


  return (
    <div className="animate-slide-up space-y-5">

      <PageHeading
        eyebrow="Analytics & Insights"
        title="Understand your earning patterns"
        text="Visualize trends, platform contribution, and your productivity."
      />


      <div className="flex flex-wrap gap-2">

        {[7,14,30].map(x=>(
          <button
            key={x}
            onClick={()=>setRange(x)}
            className={
              "btn !min-h-10 " +
              (range===x
                ? "btn-primary"
                : "btn-secondary")
            }
          >
            {x} days
          </button>
        ))}

      </div>


      <div className="card p-5">

        <div className="mb-5">

          <h2 className="font-black">
            Daily earnings trend
          </h2>

          <p className="text-xs text-slate-500">
            Actual earnings versus your dynamic daily target.
          </p>

        </div>

        <div className="h-[320px] w-full">

          <ResponsiveContainer
            width="100%"
            height="100%"
          >

            <BarChart data={daily}>

              <CartesianGrid
                strokeDasharray="3 3"
                stroke="#1e293b"
              />

              <XAxis
                dataKey="day"
                stroke="#64748b"
                fontSize={11}
              />

              <YAxis
                stroke="#64748b"
                fontSize={11}
              />

              <Tooltip
                contentStyle={{
                  background:"#0f172a",
                  border:"1px solid #334155",
                  borderRadius:12,
                  color:"#fff"
                }}
              />

              <ReferenceLine
                y={data.settings.daily}
                stroke="#f59e0b"
                strokeDasharray="5 5"
              />

              <Bar
                dataKey="earnings"
                fill="#10b981"
                radius={[5,5,0,0]}
              />

            </BarChart>

          </ResponsiveContainer>

        </div>

      </div>


      <div className="grid gap-5 lg:grid-cols-2">

        <div className="card p-5">

          <div className="mb-4">

            <h2 className="font-black">
              Platform distribution
            </h2>

            <p className="text-xs text-slate-500">
              Lifetime income by platform.
            </p>

          </div>

          <div className="h-[300px]">

            {platformData.length===0 ? (

              <EmptyState
                icon="pie-chart"
                title="No income yet"
                text="Platform distribution appears after logging earnings."
              />

            ) : (

              <ResponsiveContainer
                width="100%"
                height="100%"
              >

                <PieChart>

                  <Pie
                    data={platformData}
                    dataKey="value"
                    nameKey="name"
                    innerRadius={65}
                    outerRadius={105}
                    paddingAngle={3}
                  >

                    {platformData.map(

                  <Tooltip

                      background:"#0f172a",

        <div className="card p-5">

          </div>

          <div className="h-[300px]">

              <CartesianGrid
                strokeDasharray="3 3"
                stroke="#1e293b"
              />

              <XAxis
                dataKey="day"
                stroke="#64748b"
                fontSize={11}
              />

              <YAxis
                stroke="#64748b"
                fontSize={11}
              />

              <Tooltip
                contentStyle={{
                  background:"#0f172a",
                  border:"1px solid #334155",
                  borderRadius:12
                }}
                formatter={
                  value=>[
                    money(value),
                    "Cumulative"
                  ]
                }
              />

              <Line
                type="monotone"
                dataKey="total"
                stroke="#34d399"
                strokeWidth={3}
                dot={false}
              />

            </LineChart>

          </ResponsiveContainer>

        </div>

      </div>

    </div>
  );
}


/* =========================================================
   WITHDRAWALS
========================================================= */

function Withdrawals({
  data,
  setData,
  notify
}) {

  const [modal,setModal]=useState(false);

  const [form,setForm]=useState({
    platformId:data.platforms[0]?.id||"",
    amount:"",
    method:"PayPal",
    note:"",
    date:todayKey()
  });

  const lifetimeWithdrawn =
    data.withdrawals.reduce(
      (total,w)=>{

        const p=
          data.platforms.find(
            x=>x.id===w.platformId
          );

        return total+
          (p
            ? toGBP(
                w.amount,
                p,
                data.settings
              )
            : 0);

      },
      0
    );

  const ready =
    data.platforms.filter(
      p=>p.balance>=p.payout
    );

  function record() {

    const p=
      data.platforms.find(
        x=>x.id===form.platformId
      );

    const amount=
      Number(form.amount);

    if(!p || amount<=0) {
      notify("Enter a valid payout.");
      return;
    }

    if(amount>p.balance) {
      notify("Amount exceeds platform balance.");
      return;
    }

    setData(d=>({

      ...d,

      withdrawals:[
        {
          id:uid(),
          platformId:p.id,
          amount,
          method:form.method,
          note:form.note,
          date:form.date
        },
        ...d.withdrawals
      ],

      platforms:d.platforms.map(x=>
        x.id===p.id
          ? {
              ...x,
              balance:x.balance-amount
            }
          : x
      )

    }));

    setModal(false);

    notify("Payout recorded.");
  }

  return (
    <div className="animate-slide-up space-y-5">

      <PageHeading
        eyebrow="Withdrawals"
        title="Payout command center"
        text="Track cashout readiness and keep a lifetime withdrawal ledger."
        action={
          <button
            onClick={()=>setModal(true)}
            className="btn btn-primary"
          >
            <Icon name="plus" size={17}/>
            Record Payout
          </button>
        }
      />


      <div className="grid gap-3 sm:grid-cols-3">

        <StatCard
          title="Ready to cash out"
          value={ready.length}
          target={`${data.platforms.length} platforms`}
          icon="wallet"
          progress={
            data.platforms.length
              ? ready.length/
                data.platforms.length*100
              : 0
          }
        />

        <StatCard
          title="Lifetime withdrawn"
          value={money(lifetimeWithdrawn)}
          target="All recorded payouts"
          icon="arrow-down-to-line"
          progress={100}
        />

        <StatCard
          title="Uncashed balance"
          value={money(
            data.platforms.reduce(
              (total,p)=>
                total+
                toGBP(
                  p.balance,
                  p,
                  data.settings
                ),
              0
            )
          )}
          target="Across platforms"
          icon="circle-dollar-sign"
          progress={100}
        />

      </div>


      <div className="card overflow-hidden">

        <div className="border-b border-slate-800 p-5">

          <h2 className="font-black">
            Platform cashout tracker
          </h2>

          <p className="text-xs text-slate-500">
            See which accounts are ready and how far away the rest are.
          </p>

        </div>

        <div className="grid gap-3 p-4 sm:grid-cols-2 lg:grid-cols-3">

          {data.platforms.map(p=>{

            const progress=
              p.payout
                ? Math.min(
                    100,
                    p.balance/
                    p.payout*100
                  )
                : 0;

            const ready=
              p.balance>=p.payout;

            return (
              <div
                key={p.id}
                className="rounded-xl border border-slate-800 bg-slate-950/40 p-4"
              >

                <div className="flex justify-between">

                  <span className="font-black">
                    {p.name}
                  </span>

                  {ready && (
                    <span className="rounded-full bg-emerald-500/10 px-2 py-1 text-[9px] font-black text-emerald-400">
                      READY
                    </span>
                  )}

                </div>

                <div className="mt-4 text-xl font-black">
                  {nativeMoney(
                    p.balance,
                    p.currency
                  )}
                </div>

                <div className="mt-1 text-xs text-slate-500">
                  Threshold {nativeMoney(
                    p.payout,
                    p.currency
                  )}
                </div>

                <div className="mt-4 progress-track">

                  <div
                    className="progress-bar"
                    style={{
                      width:progress+"%"
                    }}
                  />

                </div>

                <div className="mt-2 text-[10px] font-bold text-slate-500">
                  {ready
                    ? "Available for payout"
                    : money(
                        toGBP(
                          Math.max(
                            0,
                            p.payout-p.balance
                          ),
                          p,
                          data.settings
                        )
                      )+" equivalent remaining"}
                </div>

              </div>
            );

          })}

        </div>

      </div>


      <div className="card overflow-hidden">

        <div className="border-b border-slate-800 p-5">

          <h2 className="font-black">
            Historical payouts
          </h2>

        </div>

        {data.withdrawals.length===0 ? (

          <EmptyState
            icon="arrow-down-to-line"
            title="No payouts recorded"
            text="Record your first platform cashout."
            action={()=>setModal(true)}
          />

        ) : (

          <div className="divide-y divide-slate-800">

            {data.withdrawals.map(w=>{

              const p=
                data.platforms.find(
                  x=>x.id===w.platformId
                );

              if(!p) return null;

              return (
                <div
                  key={w.id}
                  className="flex flex-col gap-2 p-4 sm:flex-row sm:items-center sm:justify-between"
                >

                  <div>

                    <div className="font-black">
                      {p.name}
                    </div>

                    <div className="text-xs text-slate-500">
                      {w.method} • {formatDate(w.date)}
                    </div>

                    {w.note && (
                      <div className="mt-1 text-xs text-slate-600">
                        {w.note}
                      </div>
                    )}

                  </div>

                  <div className="font-black text-emerald-400">
                    -{nativeMoney(
                      w.amount,
                      p.currency
                    )}
                  </div>

                </div>
              );

            })}

          </div>

        )}

      </div>


      {modal && (
        <Modal
          title="Record Platform Payout"
          close={()=>setModal(false)}
        >

          <div className="space-y-4">

            <div>
              <label className="label">
                Platform
              </label>

              <select
                className="input"
                value={form.platformId}
                onChange={e=>
                  setForm({
                    ...form,
                    platformId:e.target.value
                  })
                }
              >
                {data.platforms.map(p=>(
                  <option
                    key={p.id}
                    value={p.id}
                  >
                    {p.name}
                  </option>
                ))}
              </select>
            </div>

            <div>

              <div className="flex items-end justify-between">

                <label className="label">
                  Amount
                </label>

                <button
                  type="button"
                  onClick={()=>{

                    const p=
                      data.platforms.find(
                        x=>x.id===form.platformId
                      );

                    if(p) {
                      setForm({
                        ...form,
                        amount:String(
                          p.balance
                        )
                      });
                    }

                  }}
                  className="mb-1 text-[10px] font-black uppercase text-emerald-400"
                >
                  Use max balance
                </button>

              </div>

              <input
                className="input"
                type="number"
                step="0.01"
                value={form.amount}
                onChange={e=>
                  setForm({
                    ...form,
                    amount:e.target.value
                  })
                }
              />

            </div>

            <div>

              <label className="label">
                Payout method
              </label>

              <select
                className="input"
                value={form.method}
                onChange={e=>
                  setForm({
                    ...form,
                    method:e.target.value
                  })
                }
              >
                <option>PayPal</option>
                <option>Amazon Gift Card</option>
                <option>Direct Bank Transfer</option>
                <option>Other</option>
              </select>

            </div>

            <div>

              <label className="label">
                Date
              </label>

              <input
                className="input"
                type="date"
                value={form.date}
                onChange={e=>
                  setForm({
                    ...form,
                    date:e.target.value
                  })
                }
              />

            </div>

            <div>

              <label className="label">
                Notes
              </label>

              <textarea
                className="input min-h-[90px]"
                value={form.note}
                onChange={e=>
                  setForm({
                    ...form,
                    note:e.target.value
                  })
                }
                placeholder="Optional payout notes..."
              />

            </div>

            <button
              onClick={record}
              className="btn btn-primary w-full"
            >
              <Icon name="check" size={17}/>
              Record Payout
            </button>

          </div>

        </Modal>
      )}

    </div>
  );
}

function SettingsView({
  data,
  setData,
  exportJSON,
  exportCSV,
  loadDemo,
  clearToday,
  resetAll,
  fileRef,
  importJSON,
  editPlatform,
  addPlatform,
  deletePlatform,
  celebrate,
  notify
}) {

  function updateSettings(key,value) {

    setData(d=>({
      ...d,
      settings:{
        ...d.settings,
        [key]:value
      }
    }));

    notify("Settings saved.");
  }

  function updateRate(key,value) {

    setData(d=>({
      ...d,
      settings:{
        ...d.settings,
        [key]:Number(value)
      }
    }));

  }

  function addMilestone() {

    const value =
      Number(
        prompt(
          "Enter lifetime milestone in GBP:"
        )
      );

    if(!value || value<=0)
      return;

    setData(d=>({
      ...d,
      settings:{
        ...d.settings,
        milestones:[
          ...d.settings.milestones,
          value
        ].sort((a,b)=>a-b)
      }
    }));

    notify("Milestone added.");
  }

  return (
    <div className="animate-slide-up space-y-5">

      <PageHeading
        eyebrow="Settings & Data Control"
        title="Configure EarnTrack"
        text="Tune your targets, currencies, platforms, milestones, and backups."
      />


      <div className="grid gap-5 lg:grid-cols-2">

        <section className="card p-5">

          <SectionTitle
            icon="target"
            title="Daily targets"
            text="Set your default and custom daily earning goals."
          />

          <div className="mt-5 grid gap-4 sm:grid-cols-3">

            <NumberSetting
              label="Daily"
              value={data.settings.daily}
              onChange={v=>
                updateSettings(
                  "daily",
                  Number(v)
                )
              }
            />

            <NumberSetting
              label="Weekly"
              value={data.settings.weekly}
              onChange={v=>
                updateSettings(
                  "weekly",
                  Number(v)
                )
              }
            />

            <NumberSetting
              label="Monthly"
              value={data.settings.monthly}
              onChange={v=>
                updateSettings(
                  "monthly",
                  Number(v)
                )
              }
            />

          </div>

          <div className="mt-5 grid gap-4 sm:grid-cols-2">

            <NumberSetting
              label="Weekday override"
              value={data.settings.weekday ?? ""}
              placeholder="Default"
              onChange={v=>
                updateSettings(
                  "weekday",
                  v==="" ? null : Number(v)
                )
              }
            />

            <NumberSetting
              label="Weekend override"
              value={data.settings.weekend ?? ""}
              placeholder="Default"
              onChange={v=>
                updateSettings(
                  "weekend",
                  v==="" ? null : Number(v)
                )
              }
            />

          </div>

          <div className="mt-5">

            <label className="label">
              Missing-day redistribution

              onChange={e=>
                updateSettings(
                  "redistribution",
                  e.target.value
                )
              }
            >
              <option value="rollover">
                Roll over deficit to remaining days
              </option>

              <option value="flat">
                Keep flat daily targets
              </option>

              <option value="month-average">
                Average out remaining month
              </option>

            </select>

          </div>

        </section>


        <section className="card p-5">

          <SectionTitle
            icon="circle-dollar-sign"
            title="Currency conversion"
            text="GBP is the base currency used throughout the dashboard."
          />

          <div className="mt-5 grid gap-4">

            <NumberSetting
              label="USD → GBP"
              value={data.settings.usd}
              step="0.001"
              onChange={v=>
                updateRate("usd",v)
              }
            />

            <NumberSetting
              label="EUR → GBP"
              value={data.settings.eur}
              step="0.001"
              onChange={v=>
                updateRate("eur",v)
              }

            Exchange rates are used for GBP analytics and historical conversions.
            Existing native transaction values remain unchanged.
          </div>

        </section>

      </div>


      <section className="card overflow-hidden">

        <div className="flex flex-col gap-3 border-b border-slate-800 p-5 sm:flex-row sm:items-center sm:justify-between">

              >
                <span className="text-amber-400">

                </span>

                <span className="font-black">
                  £{m}
                </span>

              </div>
            ))}

          </div>

          <button
            onClick={addMilestone}
            className="btn btn-secondary mt-5"
          >
            <Icon name="plus" size={16}/>
            Add Milestone
          </button>

          <button
            onClick={celebrate}
            className="btn btn-ghost mt-5 ml-2"
          >
            Test Celebration 🎉
          </button>

        </section>


        <section className="card p-5">

          <SectionTitle
            icon="download"
            title="Backup & portability"
            text="Keep your data portable and safe."
          />

          <div className="mt-5 grid gap-2 sm:grid-cols-2">

              onClick={exportJSON}
              className="btn btn-secondary"
            >

              Export JSON

              className="btn btn-secondary"
            >

              Export CSV
            </button>

              className="btn btn-secondary"

              <Icon name="upload" size={16}/>

            </button>

            <input
              ref={fileRef}
              type="file"
              accept=".json,application/json"
              className="hidden"
              onChange={importJSON}
            />

              onClick={loadDemo}
              className="btn btn-primary"
            >
              <Icon name="zap" size={16}/>
              Load Demo Data
            </button>

              onClick={clearToday}
              className="btn btn-secondary"
            >
              <Icon name="rotate-ccw" size={16}/>
              Clear Today
            </button>

          </div>

      </div>


      <section className="rounded-2xl border border-red-500/20 bg-red-500/[.04] p-5">

        <div className="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">

            <div className="flex items-center gap-2 text-red-400">
              <Icon name="triangle-alert" size={18}/>
              <h2 className="font-black">
                Danger zone

            </div>

        </div>

    </div>
  );

        </div>


        <div>

          <label className="label">
            Native earning amount
          </label>

          <div className="relative">

            <span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-xs font-black text-slate-500">
              {platform?.currency==="USD"
                ? "$"
                : platform?.currency==="EUR"
                  ? "€"
                  : platform?.currency==="GBP"
                    ? "£"
                    : "PTS"}
            </span>

            <input
              className="input pl-12"
              type="number"
              step="0.01"
              min="0"
              value={form.amount}
              onChange={e=>
                setForm({
                  ...form,
                  amount:e.target.value
                })
              }
              placeholder="0.00"
              autoFocus
            />

          </div>

          {platform && form.amount && (
            <div className="mt-2 text-xs text-emerald-400">
              ≈ {money(
                toGBP(
                  Number(form.amount),
                  platform,
                  data.settings
                )
              )}
            </div>
          )}

        </div>


        <div>

          <label className="label">
            Date & time
          </label>

          <input
            className="input"
            type="datetime-local"
            value={
              form.timestamp.slice(0,16)
            }
            onChange={e=>
              setForm({
                ...form,
                timestamp:
                  new Date(
                    e.target.value
                  ).toISOString()
              })
            }
          />

        </div>


        <div>

          <label className="label">
            Note
          </label>

          <textarea
            className="input min-h-[90px]"
            value={form.note}
            onChange={e=>
              setForm({
                ...form,
                note:e.target.value
              })
            }
            placeholder="e.g. 15 minute academic study"
          />

        </div>


        <button
          onClick={()=>save(form)}
          className="btn btn-primary w-full"
        >
          <Icon name="check" size={17}/>
          {earning
            ? "Save Changes"
            : "Add Earning"}
        </button>

      </div>

    </Modal>
  );
}


/* =========================================================
   PLATFORM MODAL
========================================================= */

function PlatformModal({
  platform,
  close,
  save
}) {

  const [form,setForm]=useState({

    id:platform?.id,

    name:
      platform?.name || "",

    color:
      platform?.color || "#10b981",

    currency:
      platform?.currency || "GBP",

    payout:
      platform?.payout ?? 5,

    pointsPerGbp:
      platform?.pointsPerGbp ?? 100,

    link:
      platform?.link || "",

    status:
      platform?.status || "active",

    balance:
      platform?.balance ?? 0

  });

  return (
    <Modal
      title={
        platform
          ? "Edit Platform"
          : "Add Platform"
      }
      close={close}
    >

      <div className="space-y-4">

        <div>

          <label className="label">
            Platform name
          </label>

          <input
            className="input"
            value={form.name}
            onChange={e=>
              setForm({
                ...form,
                name:e.target.value
              })
            }
            placeholder="e.g. AttaPoll"
          />

        </div>


        <div className="grid grid-cols-[1fr_70px] gap-3">

          <div>

            <label className="label">
              Platform color
            </label>

            <input
              className="input"
              value={form.color}
              onChange={e=>
                setForm({
                  ...form,
                  color:e.target.value
                })
              }
              placeholder="#10b981"
            />

          </div>

          <div>

            <label className="label">
              Preview
            </label>

            <div
              className="h-11 w-full rounded-xl border border-slate-700"
              style={{
                background:form.color
              }}
            />

          </div>

        </div>


        <div className="grid gap-3 sm:grid-cols-2">

          <div>

            <label className="label">
              Native currency
            </label>

            <select
              className="input"
              value={form.currency}
              onChange={e=>
                setForm({
                  ...form,
                  currency:e.target.value
                })
              }
            >
              <option value="GBP">GBP (£)</option>
              <option value="USD">USD ($)</option>
              <option value="EUR">EUR (€)</option>
              <option value="POINTS">Points / Tokens</option>
            </select>

          </div>

          <div>

            <label className="label">
              Cashout minimum
            </label>

            <input
              className="input"
              type="number"
              step="0.01"
              value={form.payout}
              onChange={e=>
                setForm({
                  ...form,
                  payout:e.target.value
                })
              }
            />

          </div>

        </div>


        {form.currency==="POINTS" && (
          <div>

            <label className="label">
              Points per £1
            </label>

            <input
              className="input"
              type="number"
              value={form.pointsPerGbp}
              onChange={e=>
                setForm({
                  ...form,
                  pointsPerGbp:e.target.value
                })
              }
            />

          </div>
        )}


        <div>

          <label className="label">
            Current balance
          </label>

          <input
            className="input"
            type="number"
            step="0.01"
            value={form.balance}
            onChange={e=>
              setForm({
                ...form,
                balance:e.target.value
              })
            }
          />

        </div>


        <div>

          <label className="label">
            Login / platform URL
          </label>

          <input
            className="input"
            type="url"
            value={form.link}
            onChange={e=>
              setForm({
                ...form,
                link:e.target.value
              })
            }
            placeholder="https://example.com"
          />

        </div>


        <div>

          <label className="label">
            Status
          </label>

          <select
            className="input"
            value={form.status}
            onChange={e=>
              setForm({
                ...form,
                status:e.target.value
              })
            }
          >
            <option value="active">
              Active
            </option>

            <option value="idle">
              Idle
            </option>
          </select>

        </div>


        <button
          onClick={()=>save(form)}
          className="btn btn-primary w-full"
        >
          <Icon name="check" size={17}/>
          Save Platform
        </button>

      </div>

    </Modal>
  );
}


/* =========================================================
   DAY MODAL
========================================================= */

function DayModal({
  date,
  data,
  target,
  earned,
  close,
  editEarning,
  deleteEarning
}) {

  const transactions =
    data.earnings
      .filter(
        e=>e.timestamp.slice(0,10)===date
      )
      .sort(
        (a,b)=>
          new Date(b.timestamp)-
          new Date(a.timestamp)
      );

  return (
    <Modal
      title={formatDate(date)}
      close={close}
    >

      <div className="grid grid-cols-2 gap-3">

        <div className="rounded-xl bg-slate-900 p-4">

          <div className="text-[10px] font-bold uppercase tracking-wider text-slate-500">
            Earned
          </div>

          <div className="mt-1 text-xl font-black text-emerald-400">
            {money(earned)}
          </div>

        </div>

        <div className="rounded-xl bg-slate-900 p-4">

          <div className="text-[10px] font-bold uppercase tracking-wider text-slate-500">
            Target
          </div>

          <div className="mt-1 text-xl font-black">
            {money(target)}
          </div>

        </div>

      </div>


      <div className="mt-5">

        <div className="mb-3 flex items-center justify-between">

          <h3 className="font-black">
            Transactions
          </h3>

          <span className="text-xs text-slate-500">
            {transactions.length}
          </span>

        </div>

        <div className="divide-y divide-slate-800 rounded-xl border border-slate-800">

          {transactions.length===0 ? (

            <div className="p-8 text-center text-sm text-slate-500">
              No transactions on this day.
            </div>

          ) : (

            transactions.map(e=>{

              const p=
                data.platforms.find(
                  x=>x.id===e.platformId
                );

              if(!p) return null;

              return (
                <TransactionRow
                  key={e.id}
                  earning={e}
                  platform={p}
                  gbp={toGBP(
                    e.amount,
                    p,
                    data.settings
                  )}
                  edit={editEarning}
                  remove={deleteEarning}
                />
              );

            })

          )}

        </div>

      </div>

    </Modal>
  );
}
