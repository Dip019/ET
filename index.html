    /* =========================================================
       STORAGE
    ========================================================= */

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);

        if (!raw) {
          return {
            platforms: DEFAULT_PLATFORMS,
            transactions: [],
            withdrawals: [],
            settings: DEFAULT_SETTINGS,
            session: {
              id: uid(),
              start: null,
              elapsed: 0,
              running: false,
              date: todayISO()
            }
          };
        }

        const parsed = JSON.parse(raw);

        return {
          platforms: parsed.platforms || DEFAULT_PLATFORMS,
          transactions: parsed.transactions || [],
          withdrawals: parsed.withdrawals || [],
          settings: {
            ...DEFAULT_SETTINGS,
            ...(parsed.settings || {})
          },
          session: {
            id: uid(),
            start: null,
            elapsed: 0,
            running: false,
            date: todayISO(),
            ...(parsed.session || {})
          }
        };
      } catch (error) {
        console.error("EarnTrack storage error:", error);

        return {
          platforms: DEFAULT_PLATFORMS,
          transactions: [],
          withdrawals: [],
          settings: DEFAULT_SETTINGS,
          session: {
            id: uid(),
            start: null,
            elapsed: 0,
            running: false,
            date: todayISO()
          }
        };
      }
    }


    /* =========================================================
       HELPERS
    ========================================================= */

    const money = (value: number) =>
      `£${value.toFixed(2)}`;

    const nativeMoney = (
      value: number,
      currency: Currency
    ) => {
      if (currency === "GBP") return `£${value.toFixed(2)}`;
      if (currency === "USD") return `$${value.toFixed(2)}`;
      if (currency === "EUR") return `€${value.toFixed(2)}`;
      return `${Math.round(value).toLocaleString()} pts`;
    };

    const dateLabel = (date: string) =>
      new Date(date).toLocaleDateString(undefined, {
        day: "numeric",
        month: "short",
        year: "numeric"
      });

    const shortDate = (date: string) =>
      new Date(date).toLocaleDateString(undefined, {
        day: "numeric",
        month: "short"
      });

    const timeLabel = (date: string) =>
      new Date(date).toLocaleTimeString(undefined, {
        hour: "2-digit",
        minute: "2-digit"
      });

    function convertToGBP(
      amount: number,
      currency: Currency,
      settings: Settings,
      pointsPerGBP?: number
    ) {
      if (currency === "GBP") return amount;
      if (currency === "USD")
        return amount * settings.usdToGbp;
      if (currency === "EUR")
        return amount * settings.eurToGbp;

      return amount /
        (pointsPerGBP || settings.pointsPerGBP);
    }

    function formatDuration(seconds: number) {
      const hrs = Math.floor(seconds / 3600);
      const mins = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      return [
        hrs.toString().padStart(2, "0"),
        mins.toString().padStart(2, "0"),
        secs.toString().padStart(2, "0")
      ].join(":");
    }

    function daysInMonth(year: number, month: number) {
      return new Date(year, month + 1, 0).getDate();
    }

    function isSameDay(dateA: string, dateB: string) {
      return dateA.slice(0, 10) === dateB.slice(0, 10);
    }

    /* =========================================================
       PROGRESS RING
    ========================================================= */

    function ProgressRing({
      value,
      target
    }: {
      value: number;
      target: number;
    }) {
      const percentage =
        target > 0 ? (value / target) * 100 : 0;

      const visualPercentage =
        Math.min(percentage, 100);

      const radius = 92;
      const circumference = 2 * Math.PI * radius;
      const offset =
        circumference -
        (visualPercentage / 100) * circumference;

      return (
        <div className="relative w-64 h-64 mx-auto">
          <svg
            viewBox="0 0 220 220"
            className="w-full h-full -rotate-90"
          >
            <circle
              cx="110"
              cy="110"
              r={radius}
              fill="none"
              stroke="currentColor"
              strokeWidth="13"
              className="text-slate-200 dark:text-slate-800"
            />

            <motion.circle
              cx="110"
              cy="110"
              r={radius}
              fill="none"
              stroke="currentColor"
              strokeWidth="13"
              strokeLinecap="round"
              className="text-emerald-500"
              strokeDasharray={circumference}
              initial={{
                strokeDashoffset: circumference
              }}
              animate={{
                strokeDashoffset: offset
              }}
              transition={{
                duration: 1.2,
                ease: "easeOut"
              }}
            />
          </svg>

          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
            <p className="text-4xl font-black text-slate-900 dark:text-white">
              {Math.round(percentage)}%
            </p>

            <p className="text-sm font-medium text-slate-500">
              {money(value)} / {money(target)}
            </p>

            {percentage >= 100 ? (
              <span className="mt-2 text-xs font-bold text-emerald-500">
                TARGET CRUSHED
              </span>
            ) : (
              <span className="mt-2 text-xs font-semibold text-slate-500">
                {money(Math.max(target - value, 0))} remaining
              </span>
            )}
          </div>
        </div>
      );
    }


    /* =========================================================
       APP
    ========================================================= */

    function App() {
      const [data, setData] = useState(loadData);
      const [view, setView] = useState("dashboard");
      const [mobileMenu, setMobileMenu] = useState(false);

      const [modal, setModal] = useState<string | null>(null);

      const [editingTransaction, setEditingTransaction] =
        useState<Transaction | null>(null);

      const [selectedDate, setSelectedDate] =
        useState(todayISO());

      const [editingPlatform, setEditingPlatform] =
        useState<Platform | null>(null);

      const [search, setSearch] = useState("");
      const [filterPlatform, setFilterPlatform] =
        useState("all");

      const [timerNow, setTimerNow] = useState(Date.now());

      /* -------------------------------------------------------
         Persist
      ------------------------------------------------------- */

      useEffect(() => {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
          );
        } catch (error) {
          console.error(error);
        }
      }, [data]);


      /* -------------------------------------------------------
         Theme
      ------------------------------------------------------- */

      useEffect(() => {
        document.documentElement.classList.toggle(
          "dark",
          data.settings.theme === "dark"
        );
      }, [data.settings.theme]);


      /* -------------------------------------------------------
         Timer tick
      ------------------------------------------------------- */

      useEffect(() => {
        if (!data.session.running) return;

        const interval = setInterval(
          () => setTimerNow(Date.now()),
          1000
        );

        return () => clearInterval(interval);
      }, [data.session.running]);


      /* -------------------------------------------------------
         Derived values
      ------------------------------------------------------- */

      const today = todayISO();

      const platformMap = useMemo(() => {
        const map: Record<string, Platform> = {};

        data.platforms.forEach((p) => {
          map[p.id] = p;
        });

        return map;
      }, [data.platforms]);


      const convertTransaction = (t: Transaction) => {
        const p = platformMap[t.platformId];

        if (!p) return 0;

        return convertToGBP(
          t.amount,
          p.currency,
          data.settings,
          p.pointsPerGBP
        );
      };


      const todayTransactions =
        data.transactions.filter(
          (t) => t.date.slice(0, 10) === today
        );


      const todayEarned =
        todayTransactions.reduce(
          (sum, t) => sum + convertTransaction(t),
          0
        );


      const lifetimeEarned =
        data.transactions.reduce(
          (sum, t) => sum + convertTransaction(t),
          0
        );


      const todayTarget = (() => {
        const day = new Date(today).getDay();

        return day === 0 || day === 6
          ? data.settings.weekendTarget
          : data.settings.weekdayTarget;
      })();


      const sessionElapsed = (() => {
        if (
          !data.session.running ||
          !data.session.start
        ) {
          return data.session.elapsed;
        }

        return (
          data.session.elapsed +
          Math.floor(
            (timerNow - data.session.start) / 1000
          )
        );
      })();


      const hourlyRate =
        sessionElapsed > 0
          ? todayEarned / (sessionElapsed / 3600)
          : 0;


      /* -------------------------------------------------------
         Streak
      ------------------------------------------------------- */

      function calculateStreak() {
        let streak = 0;
        const cursor = new Date();

        while (true) {
          const iso =
            cursor.toISOString().slice(0, 10);

          const earned =
            data.transactions
              .filter(
                (t) =>
                  t.date.slice(0, 10) === iso
              )
              .reduce(
                (sum, t) =>
                  sum + convertTransaction(t),
                0
              );

          if (earned >= getTargetForDate(iso)) {
            streak++;
            cursor.setDate(
              cursor.getDate() - 1
            );
          } else {
            break;
          }
        }

        return streak;
      }


      function getTargetForDate(date: string) {
        const day = new Date(date).getDay();

        return day === 0 || day === 6
          ? data.settings.weekendTarget
          : data.settings.weekdayTarget;
      }


      const streak = calculateStreak();


      /* -------------------------------------------------------
         Recommendation Engine
      ------------------------------------------------------- */

      const recommendation = useMemo(() => {
        const candidates = data.platforms
          .filter((p) => p.status === "active")
          .map((p) => {
            const gbpBalance = convertToGBP(
              p.balance,
              p.currency,
              data.settings,
              p.pointsPerGBP
            );

            const thresholdGBP =
              convertToGBP(
                p.withdrawalThreshold,
                p.currency,
                data.settings,
                p.pointsPerGBP
              );

            return {
              platform: p,
              gbpBalance,
              thresholdGBP,
              remaining: Math.max(
                thresholdGBP - gbpBalance,
                0
              )
            };
          })
          .sort((a, b) =>
            a.remaining - b.remaining
          );

        const closest = candidates[0];

        if (!closest) return null;

        const remainingToday =
          Math.max(
            todayTarget - todayEarned,
            0
          );

        if (
          closest.remaining <= remainingToday &&
          closest.remaining > 0
        ) {
          return {
            ...closest,
            reason:
              `${closest.platform.name} is only ${money(
                closest.remaining
              )} away from cashout.`
          };
        }

        return {
          ...closest,
          reason:
            `Focus on ${closest.platform.name}; it is currently the closest platform to a withdrawal.`
        };
      }, [
        data.platforms,
        data.settings,
        todayTarget,
        todayEarned
      ]);


      /* -------------------------------------------------------
         Transactions
      ------------------------------------------------------- */

      function saveTransaction(transaction: Transaction) {
        setData((prev) => {
          const exists = prev.transactions.some(
            (t) => t.id === transaction.id
          );

          return {
            ...prev,
            transactions: exists
              ? prev.transactions.map((t) =>
                  t.id === transaction.id
                    ? transaction
                    : t
                )
              : [
                  transaction,
                  ...prev.transactions
                ]
          };
        });

        setModal(null);
        setEditingTransaction(null);
      }


      function deleteTransaction(id: string) {
        setData((prev) => ({
          ...prev,
          transactions:
            prev.transactions.filter(
              (t) => t.id !== id
            )
        }));
      }


      /* -------------------------------------------------------
         Timer
      ------------------------------------------------------- */

      function startTimer() {
        setData((prev) => ({
          ...prev,
          session: {
            ...prev.session,
            running: true,
            start: Date.now()
          }
        }));
      }


      function pauseTimer() {
        setData((prev) => {
          if (!prev.session.start) {
            return prev;
          }

          const elapsed =
            prev.session.elapsed +
            Math.floor(
              (Date.now() -
                prev.session.start) /
                1000
            );

          return {
            ...prev,
            session: {
              ...prev.session,
              running: false,
              start: null,
              elapsed
            }
          };
        });
      }


      function resetTimer() {
        setData((prev) => ({
          ...prev,
          session: {
            id: uid(),
            start: null,
            elapsed: 0,
            running: false,
            date: today
          }

      /* -------------------------------------------------------

      ------------------------------------------------------- */

      function exportJSON() {
        const blob = new Blob(
          [JSON.stringify(data, null, 2)],
          {
            type: "application/json"
          }
        );

        downloadBlob(
          blob,
          `earntrack-backup-${today}.json`
        );
      }


      function exportCSV() {
        const header =
          "Date,Time,Platform,Amount,Native Currency,GBP Value,Note\n";

        const rows =
          data.transactions
            .map((t) => {
              const p =
                platformMap[t.platformId];

              if (!p) return "";

              const gbp =
                convertTransaction(t);

              return [
                t.date.slice(0, 10),
                timeLabel(t.date),
                `"${p.name}"`,
                t.amount,
                p.currency,
                gbp.toFixed(2),
                `"${(t.note || "")
                  .replace(/"/g, '""')}"`
              ].join(",");
            })
            .join("\n");

        const blob = new Blob(
          [header + rows],
          {
            type: "text/csv"
          }
        );

        downloadBlob(
          blob,
          `earntrack-earnings-${today}.csv`
        );
      }


      function downloadBlob(
        blob: Blob,
        filename: string
      ) {
        const url =
          URL.createObjectURL(blob);

        const a =
          document.createElement("a");

        a.href = url;
        a.download = filename;
        a.click();

        URL.revokeObjectURL(url);
      }


      /* -------------------------------------------------------
         Demo data
      ------------------------------------------------------- */

      function loadDemoData() {
        const platforms = DEFAULT_PLATFORMS;

        const demo = [];

        for (let i = 0; i < 30; i++) {
          const d = new Date();

          d.setDate(
            d.getDate() - i
          );

          const date =
            d.toISOString().slice(0, 10);

          const active =
            platforms[
              i % platforms.length
            ];

          const amount =
            active.currency === "GBP"
              ? 1.25 + Math.random() * 4
              : active.currency === "USD"
              ? 1 + Math.random() * 6
              : 100 +
                Math.random() * 500;

          demo.push({
            id: uid(),
            platformId: active.id,
            amount:
              Math.round(amount * 100) /
              100,
            note:
              [
                "Short survey",
                "Academic study",
                "Product feedback",
                "User test",
                "Daily survey",
                "Opinion panel"
              ][i % 6],
            date:
              `${date}T${String(
                9 + (i % 10)
              ).padStart(2, "0")}:${String(
                (i * 13) % 60
              ).padStart(2, "0")}:00`,
            createdAt:
              new Date().toISOString()
          });
        }

        setData((prev) => ({
          ...prev,
          transactions: demo
        }));
      }

      function calculateLongestStreak() {
        const dates = Array.from(
          new Set(
            data.transactions.map(
              (t) =>
                t.date.slice(
                  0,
                  10
                )
            )
          )
        ).sort();

        let longest = 0;
        let current = 0;

        dates.forEach(
          (date, index) => {
            const target =
              getTargetForDate(
                date
              );

            const earned =
              data.transactions
                .filter(
                  (t) =>
                    t.date.slice(
                      0,
                      10
                    ) === date
                )
                .reduce(
                  (s, t) =>
                    s +
                    convertTransaction(
                      t
                    ),
                  0
                );

            if (
              earned >=
              target
            ) {
              current++;

              longest =
                Math.max(
                  longest,
                  current
                );
            } else {
              current = 0;
            }
          }
        );

        return longest;
      }


      function calculateCompletion() {
        const dates =
          Array.from(
            new Set(
              data.transactions.map(
                (t) =>
                  t.date.slice(
                    0,
                    10
                  )
              )
            )
          );

        if (!dates.length)
          return 0;

        const complete =
          dates.filter(
            (date) => {
              const earned =
                data.transactions
                  .filter(
                    (t) =>
                      t.date.slice(
                        0,
                        10
                      ) === date
                  )
                  .reduce(
                    (s, t) =>
                      s +
                      convertTransaction(
                        t
                      ),
                    0
                  );

              return (
                earned >=
                getTargetForDate(
                  date
                )
              );
            }
          ).length;

        return Math.round(
          complete /
            dates.length *
            100
        );
      }

                  16

      function PlatformModal() {
        const editing =
          editingPlatform;

        const [name, setName] =
          useState(
            editing?.name ||
              ""
          );

        const [color, setColor] =
          useState(
            editing?.color ||
              "#10b981"
          );

        const [currency, setCurrency] =
          useState<Currency>(
            editing?.currency ||
              "GBP"
          );

        const [threshold, setThreshold] =
          useState(
            editing
              ? String(
                  editing.withdrawalThreshold
                )
              : ""
          );

        const [balance, setBalance] =
          useState(
            editing
              ? String(
                  editing.balance
                )
              : "0"
          );

        const [url, setUrl] =
          useState(
            editing?.url ||
              ""
          );

        const [status, setStatus] =
          useState<
            "active" | "idle"
          >(
            editing?.status ||
              "active"
          );

        const [pointsPerGBP, setPointsPerGBP] =
          useState(
            editing?.pointsPerGBP ||
              data.settings.pointsPerGBP
          );


        function save() {
          if (!name.trim())
            return;

          const platform: Platform =
            {
              id:
                editing?.id ||
                uid(),
              name:
                name.trim(),
              color,
              currency,
              withdrawalThreshold:
                Number(
                  threshold
                ),
              balance:
                Number(
                  balance
                ),

      /* =======================================================

      ======================================================= */

      function RestoreModal() {
        const inputRef =
          useRef<HTMLInputElement>(
            null
          );

        function restore(file: File) {
          const reader =
            new FileReader();

          reader.onload = () => {
            try {
              const parsed =
                JSON.parse(
                  String(
                    reader.result
                  )
                );

              if (
                !parsed.platforms ||
                !parsed.transactions
              ) {
                throw new Error(
                  "Invalid backup"
                );
              }

              setData({
                platforms:
                  parsed.platforms,
                transactions:
                  parsed.transactions,
                withdrawals:
                  parsed.withdrawals ||
                  [],
                settings: {
                  ...DEFAULT_SETTINGS,
                  ...(parsed.settings ||
                    {})
                },
                session: {
                  ...data.session,
                  ...(parsed.session ||
                    {})
                }
              });

              setModal(
                null
              );
            } catch (e) {
              console.error(e);
              alert(
                "That backup file is invalid."
              );
            }
          };

          reader.readAsText(
            file
          );
        }

        return (
          <div className="space-y-5">

            <div className="p-5 rounded-2xl bg-amber-500/10 border border-amber-500/20">
              <div className="flex gap-3">
                <AlertTriangle
                  className="text-amber-500 shrink-0"
                />

                <div>
                  <p className="font-bold text-slate-900 dark:text-white">
                    Restore backup
                  </p>

                  <p className="text-sm text-slate-500 mt-1">
                    Importing will replace the current EarnTrack database in this browser.
                  </p>
                </div>
              </div>
            </div>

            <input
              ref={
                inputRef
              }
              type="file"
              accept=".json,application/json"
              className="hidden"
              onChange={(e) => {
                const file =
                  e.target
                    .files?.[0];

                if (file)
                  restore(
                    file
                  );
              }}
            />

            <Button
              className="w-full"
              onClick={() =>
                inputRef.current?.click()
              }
            >
              <span className="flex justify-center gap-2 items-center">
                <Upload size={18} />
                Choose JSON Backup
              </span>
            </Button>

          </div>
        );
      }
